# A made-up sample week for the demo: uv run mycal-demo examples/week.toml
# Put real weeks in solver/weeks/ (gitignored), not here.
#
# Local dates, times and datetimes are in `timezone`. Weekdays: 0 = Monday.
# Presets: exact, day, day_range, days, before_deadline, custom.
# A days item belongs to this file's week (week_start); `week` can override it.
# A days item with every_day = true and session_min gets one session of that
# length on every chosen day; it sets estimate_min, max_chunk_min and
# one_block_per_day itself, so leave those out.

timezone = "America/Los_Angeles"
week_start = 2026-11-16  # a Monday
slot_min = 15

[[work_frames]]
name = "Weekdays"
weekdays = [0, 1, 2, 3, 4]
start_time = 09:00:00
end_time = 18:00:00

[[work_frames]]
name = "Weekend"
weekdays = [5, 6]
start_time = 10:00:00
end_time = 16:00:00

# Extra rules. daily_limit caps scheduled minutes on matching days
# (everything counts, fixed events included). Only hard limits for now.
[[constraints]]
kind = "daily_limit"
hard = true
max_min = 120
weekdays = [5, 6]  # at most 2h on Saturday and Sunday

# Soft rules change which arrangement wins, never whether one fits. `items`
# names items or series by title (omit it to cover every item); `weight`
# scales the penalty (default 1).
#
# time_preference: "prefer" penalizes each minute of a block outside the
# ranges, "avoid" each minute inside them. A block only has to fit one range.
# Days no range lists count as outside. A single range can also be written
# as top-level weekdays, start_time and end_time.
[[constraints]]
kind = "time_preference"
items = ["Gym"]
mode = "prefer"
ranges = [
  { weekdays = [0, 1, 2, 3, 4], start_time = 16:00:00, end_time = 18:00:00 },
  { weekdays = [5, 6], start_time = 12:00:00, end_time = 14:00:00 },
]

# rest_between: sessions of the same item should have at least min_gap_days
# free days between them. Done sessions count, so if one moves, the rest
# re-space around it.
[[constraints]]
kind = "rest_between"
items = ["Gym"]
min_gap_days = 1

# "avoid": keep reading out of the mornings when it can.
[[constraints]]
kind = "time_preference"
items = ["Read for seminar"]
mode = "avoid"
weekdays = [0, 1, 2, 3, 4]
start_time = 09:00:00
end_time = 12:00:00

# Series repeat every week. `rrule` is an iCalendar RRULE (FREQ=DAILY or
# WEEKLY, INTERVAL, BYDAY, UNTIL or COUNT). Template params hold times of day
# only; each occurrence's date fills in the day. Optional: end_date,
# skipped_dates.

[[series]]
title = "Algorithms lecture"
rrule = "FREQ=WEEKLY;BYDAY=TU,TH;UNTIL=20261211"
start_date = 2026-09-01
preset = "exact"
start_time = 11:00:00
end_time = 12:30:00
checkable = true
on_miss = "catch_up"

[[series]]
title = "Linear algebra"
rrule = "FREQ=WEEKLY;BYDAY=MO,WE,FR;UNTIL=20261211"
start_date = 2026-09-02
preset = "exact"
start_time = 13:00:00
end_time = 14:00:00
checkable = true

# "3 times a week": one occurrence per week, anchored on Monday, split into
# three 1h sessions on different days.
[[series]]
title = "Gym"
rrule = "FREQ=WEEKLY;BYDAY=MO"
start_date = 2026-09-07
preset = "days"
weekdays = [0, 2, 4]
estimate_min = 180
max_chunk_min = 60
one_block_per_day = true

[[series]]
title = "Weekly problem set"
rrule = "FREQ=WEEKLY;BYDAY=FR"
start_date = 2026-09-04
preset = "before_deadline"
deadline_time = 17:00:00
estimate_min = 240
max_chunk_min = 120

# One-off items

[[items]]
title = "Chemistry lab"
preset = "day"
day = 2026-11-18
estimate_min = 120

[[items]]
title = "Career fair"
preset = "exact"
start = 2026-11-18T14:30:00
end = 2026-11-18T16:00:00

[[items]]
title = "Study group"
preset = "exact"
start = 2026-11-19T15:00:00
end = 2026-11-19T16:30:00

# 4h of reading in sessions of at most 1.5h, Monday to Thursday
[[items]]
title = "Read for seminar"
preset = "days"
weekdays = [0, 1, 2, 3]
estimate_min = 240
max_chunk_min = 90

[[items]]
title = "Call home"
preset = "day_range"
day = 2026-11-19
start_time = 17:00:00
end_time = 21:00:00
estimate_min = 30

[[items]]
title = "Practice piano"  # 30 min on every weekday evening
preset = "days"
weekdays = [0, 1, 2, 3, 4]
start_time = 18:00:00
end_time = 20:00:00
every_day = true
session_min = 30

# A project with steps that depend on each other

[[items]]
title = "Project 3: design"
preset = "before_deadline"
deadline = 2026-11-22T16:00:00
estimate_min = 120

[[items]]
title = "Project 3: implement"
preset = "before_deadline"
deadline = 2026-11-22T16:00:00
estimate_min = 300
max_chunk_min = 120
depends_on = ["Project 3: design"]

[[items]]
title = "Project 3: write-up"
preset = "before_deadline"
deadline = 2026-11-22T16:00:00
estimate_min = 60
depends_on = ["Project 3: implement"]

# Not scheduled yet: no windows, so it stays in the task list

[[items]]
title = "Email advisor"
preset = "custom"
windows = []
estimate_min = 15
